[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phospholipid-structure-pretrain"
version = "0.1.0"
description = "Structure-only phospholipid template pretraining"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.9,<3", "torch-geometric>=2.8,<3", "rdkit>=2025.9",
  "lightning>=2.6,<3", "omegaconf>=2.3,<3", "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]
library = ["pyarrow>=20,<25", "PyYAML>=6,<7", "msgpack>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
