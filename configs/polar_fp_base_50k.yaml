version: v0.4
model:
  encoder: fingerprint
  dropout: 0.1
  template_dropout: 0.2
  max_polar_length: 84
train:
  seed: 42
  batch_size: 16
  gradient_accumulation: 1
  num_workers: 2
  cpu_threads: 4
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_clip: 1.0
  max_steps: 5000
  checkpoint_every: 1000
  precision: fp32
max_top_k: 3
h_fraction: 0.8
minimum_similarity: 0.2
