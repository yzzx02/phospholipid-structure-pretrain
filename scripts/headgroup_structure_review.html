<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polar 头基结构审核</title>
<style>
:root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#202d3b;background:#f2f4f7;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#20384d;color:white;padding:28px max(24px,calc((100vw - 1480px)/2));}h1{font-size:26px;margin:0 0 12px}header p{color:#dae4ed;line-height:1.8;margin:4px 0}main{max-width:1530px;margin:auto;padding:20px 24px}.toolbar{position:sticky;top:0;z-index:5;background:#f2f4f7ed;backdrop-filter:blur(8px);padding:10px 0 14px;border-bottom:1px solid #d9e1e8}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}button,select,input{font:inherit;border:1px solid #c4cdd7;border-radius:6px;padding:9px 12px;background:white;color:#23384b}button{cursor:pointer}button:hover{border-color:#3b7898}button.active{color:white;background:#285777;border-color:#285777}input[type=search]{min-width:300px;flex:1}input[type=checkbox]{min-width:unset;flex:unset}button.primary{color:white;background:#285777}label{font-size:14px}#status{font-size:14px;color:#526273;margin:10px 0}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px}.card{background:white;border:1px solid #dce2e9;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px #182c4010}.card .heading{padding:14px 16px 8px;display:flex;justify-content:space-between;gap:8px}.card h2{font-size:18px;margin:4px 0;overflow-wrap:anywhere}.id{font:12px Consolas,monospace;color:#647487}.badge{font-size:12px;border-radius:4px;padding:5px 7px;white-space:nowrap;height:max-content}.retain{background:#e6f2ed;color:#245c49}.review{background:#fff1d8;color:#875c16}.exclude{background:#f9e8e5;color:#924438}.drawing{height:300px;cursor:zoom-in;display:flex;align-items:center;justify-content:center;padding:0 4px;background:#fff}.drawing svg{width:100%;height:100%}.body{padding:8px 16px 14px}.name{font-size:13px;color:#566779;line-height:1.5;max-height:42px;overflow:auto}.reason{font-size:13px;line-height:1.7;min-height:44px;margin:10px 0}.meta{display:flex;gap:7px;flex-wrap:wrap;color:#667482;font-size:12px;margin:6px 0 12px}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:13px}.note{width:100%;margin-top:8px;padding:8px;font-size:13px}details{margin-top:12px;font-size:12px;color:#526273}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:12px}a{color:#22678b}.legend{font-size:13px}.blue{color:#95d9ff}.red{color:#bd4d47}.notice{font-size:12px;color:#566779;margin:6px 0}dialog{width:min(1400px,96vw);max-height:95vh;border:1px solid #ccd8e0;border-radius:10px;padding:20px}dialog::backdrop{background:#11202dcc}dialog[open]{display:flex;flex-direction:column;height:94vh}#zoomDrawing{width:100%;min-height:180px;flex:1}#zoomReason{font-size:13px;line-height:1.6;margin:8px 0}#zoomName{margin:8px 0}#zoomDrawing svg{width:100%;height:100%}#zoomName{font-size:19px;line-height:1.5;overflow-wrap:anywhere}#zoomControls{justify-content:space-between}#empty{display:none;text-align:center;padding:60px;color:#637789}footer{font-size:13px;color:#617487;line-height:1.9;margin:24px 0}.fileButton input{width:190px;min-width:unset;font-size:12px}@media(max-width:850px){#grid{grid-template-columns:1fr}.drawing{height:320px}header{padding:20px}main{padding:12px}input[type=search]{min-width:210px}.toolbar{position:static}}@media print{header,.toolbar,footer,.actions,.note,details{display:none}.card{break-inside:avoid}#grid{grid-template-columns:repeat(2,1fr)}.drawing{height:240px}.card{box-shadow:none}}
</style>
</head>
<body>
<header><h1>Polar 头基结构审核</h1><p id="intro"></p><p class="legend"><span class="blue">蓝色：P 与 [*:1] 甘油连接位点</span>　<span class="red" style="color:#ffc6bd">红色：检出的额外长链／甾醇锚点</span>。点击任意结构可放大，用左右键逐张看。</p></header>
<main><section class="toolbar">
<div class="row" id="tabs"><button data-view="remaining" class="active">保留＋待判断</button><button data-view="retain">初筛保留</button><button data-view="review">待判断</button><button data-view="exclude">已排除</button><button data-view="all">全部原始图</button></div>
<div class="row"><input id="search" type="search" placeholder="搜索简写、英文名、别名或 Polar ID"><label><input id="unreviewed" type="checkbox"> 仅未人工标记</label><button id="exportCsv" class="primary">导出审核 CSV</button><button id="exportJson">备份审核 JSON</button><label class="fileButton">导入备份 <input id="importJson" type="file" accept=".json"></label></div>
<p class="notice">你的决定与自动初筛分开记录。浏览器会尽量在本机保存进度，请用“备份审核 JSON”保存可迁移的副本。原库不会被改动。</p>
<div id="status" role="status"></div></section>
<section id="grid"></section><div id="empty">没有符合条件的结构。</div>
<footer>结构直接由 v0.1 Polar SMILES 用 RDKit 绘制，未删链、补原子或改变连接。当前图采用模型的非手性表示；原始带立体信息的结构及全部来源保留在 v0.1 库。多个 P 或多个糖环不会自动导致排除。<br>“初筛保留”仅表示没有发现本轮禁止的额外脂质锚点；最终是否纳入由你的人工决定确定。</footer>
</main>
<dialog id="zoom"><div class="row" id="zoomControls"><button id="prev">上一张</button><span id="zoomPosition"></span><button id="next">下一张</button><button id="closeZoom">关闭</button></div><h2 id="zoomName"></h2><div id="zoomDrawing"></div><p id="zoomReason"></p><div id="zoomActions" class="actions"></div></dialog>
<script>
'use strict';
const DATA=__DATA__;
const SUMMARY=__SUMMARY__;
const LABEL={retain:'初筛保留',review:'待人工判断',exclude:'初筛排除'};
const CHOICE={keep:'保留',exclude:'排除',review:'待判断'};
const KEY='polar-headgroup-review-v01-'+SUMMARY.input_sha256.slice(0,16);
let decisions={},storageOK=true,view='remaining',visible=[],zoomIndex=0;
try{decisions=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){storageOK=false}
const $=id=>document.getElementById(id);
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function save(){try{localStorage.setItem(KEY,JSON.stringify(decisions))}catch(e){storageOK=false}}
function setChoice(id,decision){decisions[id]={...decisions[id],decision,updated_at:new Date().toISOString()};save();render();if($('zoom').open)renderZoom()}
function actionBar(r){const bar=el('div','actions');for(const [key,label] of Object.entries(CHOICE)){const b=el('button',decisions[r.headgroup_id]?.decision===key?'active':'',label);b.onclick=()=>setChoice(r.headgroup_id,key);bar.append(b)}const reset=el('button','','撤销标记');reset.onclick=()=>{delete decisions[r.headgroup_id];save();render();if($('zoom').open)renderZoom()};bar.append(reset);return bar}
function card(r){const c=el('article','card');c.dataset.id=r.headgroup_id;const head=el('div','heading'),left=el('div');left.append(el('div','id',r.review_number+' · '+r.headgroup_id),el('h2','',r.abbreviation||'未命名 Polar'));head.append(left,el('span','badge '+r.auto_status,LABEL[r.auto_status]));c.append(head);const drawing=el('div','drawing');drawing.innerHTML=r.svg;drawing.title='点击放大结构';drawing.onclick=()=>{zoomIndex=visible.indexOf(r);renderZoom();$('zoom').showModal()};c.append(drawing);const body=el('div','body');body.append(el('div','name',r.full_name),el('p','reason',r.filter_reason));const meta=el('div','meta');meta.append(el('span','',r.builder_compatible?'Builder 通过':'Builder 未通过'),el('span','',r.literature_verified?'文献已核实':'文献未核实'),el('span','',r.carbon_count+' C · '+r.P_count+' P'));body.append(meta,actionBar(r));const note=el('input','note');note.placeholder='你的备注（可选）';note.value=decisions[r.headgroup_id]?.note||'';note.onchange=()=>{decisions[r.headgroup_id]={...decisions[r.headgroup_id],note:note.value,updated_at:new Date().toISOString()};save()};body.append(note);const d=el('details');d.append(el('summary','','SMILES、来源与图片下载'));d.append(el('pre','',r.polar_smiles));const links=el('div','row');for(const [label,p]of [['SVG',r.svg_path],['高清 PNG',r.png_path]]){const a=el('a','',label);a.href=p;a.target='_blank';links.append(a)}for(const [i,url] of r.source_urls.entries()){const a=el('a','','来源 '+(i+1));a.href=url;a.target='_blank';a.rel='noopener';links.append(a)}d.append(links);d.append(el('p','',r.source));body.append(d);c.append(body);return c}
function matches(r){const q=$('search').value.trim().toLocaleLowerCase();return(view==='all'||(view==='remaining'&&r.auto_status!=='exclude')||r.auto_status===view)&&(!q||r.search_text.includes(q))&&(!$('unreviewed').checked||!decisions[r.headgroup_id]?.decision)}
function render(){visible=DATA.filter(matches);$('grid').replaceChildren(...visible.map(card));$('empty').style.display=visible.length?'none':'block';const reviewed=Object.values(decisions).filter(d=>d.decision).length;const counts=Object.fromEntries(Object.keys(CHOICE).map(k=>[k,Object.values(decisions).filter(d=>d.decision===k).length]));$('status').textContent=`显示 ${visible.length} / ${DATA.length} 个结构。已人工标记 ${reviewed} 个：保留 ${counts.keep}，排除 ${counts.exclude}，待判断 ${counts.review}。`+(storageOK?'':' 浏览器自动保存不可用，请导出备份。')}
function renderZoom(){if(!visible.length){$('zoom').close();return}zoomIndex=(zoomIndex+visible.length)%visible.length;const r=visible[zoomIndex];$('zoomName').textContent=r.review_number+' · '+(r.abbreviation||'未命名 Polar')+' · '+r.headgroup_id;$('zoomDrawing').innerHTML=r.svg;$('zoomReason').textContent=r.filter_reason;$('zoomPosition').textContent=(zoomIndex+1)+' / '+visible.length;$('zoomActions').replaceChildren(actionBar(r))}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function csvText(){const cols=['review_number','headgroup_id','abbreviation','auto_status','human_decision','human_note','filter_reason','polar_smiles','updated_at'];const quote=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=DATA.map(r=>({...r,human_decision:decisions[r.headgroup_id]?.decision||'',human_note:decisions[r.headgroup_id]?.note||'',updated_at:decisions[r.headgroup_id]?.updated_at||''}));return '\ufeff'+[cols,...rows.map(r=>cols.map(k=>r[k]))].map(row=>row.map(quote).join(',')).join('\r\n')}
$('intro').textContent=`基于 v0.1 的 ${SUMMARY.input_graphs} 个结构：初筛保留 ${SUMMARY.counts.retain} 个，排除 ${SUMMARY.counts.exclude} 个，待判断 ${SUMMARY.counts.review} 个。默认展示去掉明显额外脂质锚点后的全部 ${SUMMARY.counts.retain+SUMMARY.counts.review} 个结构。`;
for(const b of $('tabs').children){b.onclick=()=>{view=b.dataset.view;for(const t of $('tabs').children)t.classList.toggle('active',t===b);render();window.scrollTo({top:0,behavior:'instant'})}}
$('search').oninput=render;$('unreviewed').onchange=render;
$('exportCsv').onclick=()=>download('headgroup_manual_review.csv',csvText(),'text/csv;charset=utf-8');
$('exportJson').onclick=()=>download('headgroup_manual_review.json',JSON.stringify({schema:'headgroup-review-v01',input_sha256:SUMMARY.input_sha256,exported_at:new Date().toISOString(),decisions},null,2),'application/json');
$('importJson').onchange=async event=>{try{const data=JSON.parse(await event.target.files[0].text());if(data.schema!=='headgroup-review-v01'||data.input_sha256!==SUMMARY.input_sha256)throw Error('备份对应的源库不同');const known=new Set(DATA.map(r=>r.headgroup_id));for(const[id,d]of Object.entries(data.decisions||{})){if(!known.has(id)||!d||typeof d!=='object'||(d.decision&&!Object.hasOwn(CHOICE,d.decision)))throw Error('备份含无效 ID 或决定')}decisions={...decisions,...data.decisions};save();render()}catch(e){alert('无法导入：'+e.message)}event.target.value=''};
$('prev').onclick=()=>{zoomIndex--;renderZoom()};$('next').onclick=()=>{zoomIndex++;renderZoom()};$('closeZoom').onclick=()=>$('zoom').close();
document.addEventListener('keydown',e=>{if($('zoom').open){if(e.key==='ArrowLeft'){zoomIndex--;renderZoom()}if(e.key==='ArrowRight'){zoomIndex++;renderZoom()}}});
render();
</script>
</body></html>
