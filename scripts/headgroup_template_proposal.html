<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>基础模板补选与覆盖评价</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f7;color:#21394c;font:16px/1.6 "Microsoft YaHei",Arial,sans-serif}header{background:#21394c;color:white;padding:25px 3vw}h1{margin:0 0 10px;font-size:29px}header p{margin:5px 0}main{padding:24px 2vw}.controls{position:sticky;top:0;background:#f1f4f7f5;padding:12px 0;z-index:3;display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;padding:9px;border:1px solid #b9cad7;border-radius:6px;background:white;color:#21394c}button{cursor:pointer}button.active{background:#2b607b;color:white}#search{flex:1;min-width:250px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px}.card{padding:20px;background:white;border:1px solid #d9e2e9;border-radius:12px;min-width:0}.card h2{font-size:20px;overflow-wrap:anywhere;margin:6px 0}.id{color:#637f92;font:13px Consolas,monospace;overflow-wrap:anywhere}.drawing{height:360px;cursor:zoom-in}.drawing svg{width:100%;height:100%}.tag{font-size:13px;background:#e6f0f2;padding:3px 8px;border-radius:4px;display:inline-block;margin:3px}.new{background:#fff1cf}.note{color:#617686;font-size:14px}textarea{font:inherit;width:100%;margin-top:8px;min-height:55px;border:1px solid #c5d2dc;border-radius:5px}details{overflow-wrap:anywhere;margin-top:10px}table{border-collapse:collapse;width:100%;background:white;font-size:14px}td,th{padding:10px;border-bottom:1px solid #d5e0e8;text-align:right}td:first-child,th:first-child{text-align:left}.statistics{display:none}.statistics img{width:100%;max-width:1400px}#modal{position:fixed;inset:0;display:none;background:#142c3de8;z-index:10;padding:25px;overflow:auto}#modal .content{background:white;max-width:1450px;margin:auto;padding:20px}#modal svg{width:100%;height:75vh}.bad{color:#9b4e25}a{color:#226985}summary{cursor:pointer}label{white-space:nowrap}#count{margin:10px 0 18px}.decision{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:500px){.grid{grid-template-columns:1fr}.drawing{height:280px}}
</style>
<header><h1>基础模板补选与覆盖评价</h1><p id="headline"></p><p>保留你的原审核决定。新增结构来自冻结库，均为算法建议，尚未人工确认。600 Da 限制用于新增候选。</p><p>本次忽略旧训练/验证/测试划分。全部 195,306 个核心参与覆盖统计；计算距离时排除目标自身及其磷酸质子化重复。</p></header>
<main><div class="controls"><button data-view="new" class="active">新增候选</button><button data-view="approved">已有保留</button><button data-view="blocked">当前模型暂不适用</button><button data-view="statistics">覆盖统计</button><label>模板总数 <select id="size"><option>200</option><option selected>250</option><option>300</option><option>350</option></select></label><input id="search" placeholder="搜索名称、ID、分子式、官能团"><button id="export">导出新增审核 CSV</button><button id="backup">备份新增审核 JSON</button><label>导入备份 <input id="restore" type="file" accept=".json" style="width:140px"></label></div><p id="count"></p><div class="grid" id="grid"></div><section class="statistics" id="statistics"><h2>不同模板数量的覆盖情况</h2><p>结构相似阈值用于比较方案，不代表鉴定成功率。分子式差异是相同开放 Polar 边界下的元素计数差，不能代替结构匹配。</p><div id="coverageTable"></div><img src="data:image/png;base64,__COVERAGE_PNG__" alt="模板相似度和分子式覆盖分布"><h2>250 个方案的官能团覆盖</h2><div id="functionTable"></div><h2>250 个方案的元素组成覆盖</h2><div id="elementTable"></div><p>官能团按公开 SMARTS 规则识别，结构可属于多个类别。数据库/程序构建来源均保留原标记，未自动升级为文献已报道。</p></section></main>
<div id="modal"><div class="content"><button id="close">关闭</button><div id="large"></div></div></div>
<script>
const DATA=__PAYLOAD__;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='headgroup-template-proposal-'+DATA.proposal_input_sha256;let decisions={};try{decisions=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{}let view='new';
$('headline').textContent=`已审核保留 ${DATA.summary.approved_catalog_graphs} 个图，质子化归并后 ${DATA.summary.conceptual_human_approved_seed_graphs} 个基础模板。可补选到 200 / 250 / 300 / 350 个。`;
const labels={keep:'保留',exclude:'排除',review:'待判断','':'未判断'};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(decisions))}catch{}}
function render(){const size=+$('size').value,term=$('search').value.toLowerCase();const rows=DATA.rows.filter(r=>{
if(view==='new'&&(r.kind!=='new'||r.first_bank_size>size))return false;if(view==='approved'&&r.kind!=='approved')return false;if(view==='blocked'&&(r.kind!=='approved'||r.training_reference_eligible))return false;
return [r.review_number,r.headgroup_id,r.display_name,r.polar_smiles,r.open_polar_formula,JSON.stringify(r.functional_categories||[])].join(' ').toLowerCase().includes(term)});
$('grid').style.display=view==='statistics'?'none':'grid';$('statistics').style.display=view==='statistics'?'block':'none';
const marked=Object.values(decisions).filter(d=>d.decision).length;$('count').textContent=view==='statistics'?'完整库覆盖评价，不是模型预测准确率。':`显示 ${rows.length} 个结构。新增候选已标记 ${marked} 个。HTML 与 Excel 的修改分别保存，请导出备份。`;
if(view==='statistics')return;
$('grid').innerHTML=rows.map(r=>{const d=decisions[r.headgroup_id]||{},known=r.kind==='approved';return `<article class="card" data-id="${esc(r.headgroup_id)}"><div class="id">${esc(r.review_number)} · ${esc(r.headgroup_id)}</div><h2>${esc(r.display_name)}</h2><span class="tag ${known?'':'new'}">${known?'已人工保留':'新增待审'}</span><span class="tag">${esc(r.open_polar_formula)} · ${Number(r.average_mass_Da).toFixed(1)} Da</span>${known?'':`<span class="tag">从 ${r.first_bank_size} 个方案起加入</span>`}<div class="drawing">${r.svg}</div><p>${esc((r.functional_categories||[]).join(' · '))}</p>${known?`<p class="${r.training_reference_eligible?'note':'bad'}">${r.training_reference_eligible?'模板特征入口检查通过':esc(r.training_reference_blockers)}</p><p class="note">${r.target_label_eligible?"目标标签检查通过":"目标标签: "+esc(r.target_label_blockers)}</p><p>原审核：保留。${esc(r.human_note)}</p>`:`<p class="note">与已选模板的最高相似度 ${Number(r.nearest_prior_template_tanimoto).toFixed(3)}；Builder 与组装分子式检查通过。</p><p class="note">原始来源：${esc(r.structure_origin)}；完整磷脂报道标记：${esc(r.is_full_lipid_reported)}</p><div class="decision">${['keep','exclude','review',''].map(v=>`<button class="${(d.decision||'')===v?'active':''}" data-decision="${v}">${labels[v]}</button>`).join('')}</div><textarea placeholder="备注（可选）">${esc(d.note||'')}</textarea>`}<details><summary>SMILES、来源和图片</summary><p>${esc(r.polar_smiles)}</p><p>${esc(r.source||r.evidence_source||'')} ${esc(r.source_attachment_provenance||'')}</p><p>${(r.source_cids||[]).map(cid=>`<a target="_blank" rel="noopener" href="https://pubchem.ncbi.nlm.nih.gov/compound/${Number(cid)}">源 CID ${Number(cid)}</a>`).join(' ')}</p><p>${esc(r.source_url||'')}</p><a href="${esc(r.svg_path)}" download>SVG</a> · <a href="${esc(r.png_path)}" download>PNG</a></details></article>`}).join('');
for(const card of $('grid').children){const id=card.dataset.id;card.querySelector('.drawing').onclick=()=>{$('large').innerHTML=card.querySelector('h2').outerHTML+card.querySelector('.drawing').innerHTML;$('modal').style.display='block'};for(const b of card.querySelectorAll('[data-decision]'))b.onclick=()=>{decisions[id]={...(decisions[id]||{}),decision:b.dataset.decision,updated_at:new Date().toISOString()};persist();render()};const area=card.querySelector('textarea');if(area)area.onchange=()=>{decisions[id]={...(decisions[id]||{}),note:area.value,updated_at:new Date().toISOString()};persist()}}
}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
$('backup').onclick=()=>download('template_proposal_manual_review.json',JSON.stringify({schema:'template-proposal-review-v01',input_sha256:DATA.proposal_input_sha256,exported_at:new Date().toISOString(),decisions},null,2),'application/json');
$('export').onclick=()=>{const fields=['headgroup_id','polar_smiles','first_bank_size','human_decision','human_note'];const quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const lines=[fields,...DATA.rows.filter(r=>r.kind==='new').map(r=>[r.headgroup_id,r.polar_smiles,r.first_bank_size,decisions[r.headgroup_id]?.decision||'',decisions[r.headgroup_id]?.note||''])];download('template_proposal_manual_review.csv','\ufeff'+lines.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
$('restore').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(obj.schema!=='template-proposal-review-v01'||obj.input_sha256!==DATA.proposal_input_sha256)throw Error('备份与本批候选不匹配');const ids=new Set(DATA.rows.filter(r=>r.kind==='new').map(r=>r.headgroup_id));if(Object.keys(obj.decisions).some(id=>!ids.has(id)))throw Error('存在未知 ID');decisions=obj.decisions;persist();render()}catch(err){alert(err.message)}};
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()};$('size').onchange=render;$('search').oninput=render;$('close').onclick=()=>{$('modal').style.display='none'};document.onkeydown=e=>{if(e.key==='Escape')$('close').click()};
function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
const pct=x=>(x*100).toFixed(2)+'%';$('coverageTable').innerHTML=table(['模板数','相似度≥0.5','相似度≥0.7','相似度<0.3 个数','最近重元素计数差中位数','固定非模板目标≥0.5'],DATA.summary.proposed_sizes.map(n=>{const s=DATA.coverage[n].all_frozen;return[n,pct(s['fraction_at_least_0.5']),pct(s['fraction_at_least_0.7']),s.very_far_count,s.formula_distance_quantiles.minimum_heavy_element_L1['0.5'],pct(DATA.coverage[n].fixed_unseen_targets['fraction_at_least_0.5'])]}));
const c=DATA.coverage['250'].all_frozen;$('functionTable').innerHTML=table(['官能团','目标数','模板数','该类目标相似度≥0.5'],Object.entries(c.functional_categories).map(([k,v])=>[k,v.target_count,v.template_count,v.target_count?pct(v['target_fraction_with_similarity_at_least_0.5']):'无此类目标']));$('elementTable').innerHTML=table(['元素组合','目标数','模板数','该类目标相似度≥0.5'],Object.entries(c.element_sets).map(([k,v])=>[k,v.target_count,v.template_count,pct(v['fraction_with_similarity_at_least_0.5'])]));render();
</script></html>
