name: CPU structure pretraining
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints-tested.txt -e '.[dev]'
      - name: Lint and tests
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
      - name: Actual training steps
        run: |
          python train_structure_dummy.py --config configs/structure_pretrain_graph.yaml --steps 2 --output outputs/graph
          python train_structure_dummy.py --config configs/structure_pretrain_fp.yaml --steps 2 --output outputs/fingerprint
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-run-summaries
          path: outputs/*/run_summary.json
