name: CPU structure pretraining
on:
  push:
    paths: &model_paths
      - 'src/structure_pretrain/models/**'
      - 'src/structure_pretrain/training/**'
      - 'src/structure_pretrain/data/**'
      - 'src/structure_pretrain/retrieval/**'
      - 'src/structure_pretrain/utils/**'
      - 'src/structure_pretrain/config.py'
      - 'configs/structure_pretrain_*.yaml'
      - 'train_structure_dummy.py'
      - 'scripts/check_encoder_batch.py'
      - 'scripts/count_parameters.py'
      - 'tests/test_graph*.py'
      - 'tests/test_fingerprint*.py'
      - 'tests/test_structure_pretrain*.py'
      - 'tests/test_template*.py'
      - 'tests/test_retrieval_and_schema.py'
      - 'tests/conftest.py'
  pull_request:
    paths: *model_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c constraints-tested.txt -e '.[dev,library]'
      - name: Lint and tests
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
      - name: Actual training steps
        run: |
          python train_structure_dummy.py --config configs/structure_pretrain_graph.yaml --steps 2 --output outputs/graph
          python train_structure_dummy.py --config configs/structure_pretrain_fp.yaml --steps 2 --output outputs/fingerprint
          python scripts/check_encoder_batch.py > outputs/encoder_batch.json
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-run-summaries
          path: |
            outputs/*/run_summary.json
            outputs/encoder_batch.json
