name: Structure library builder only
on:
  push:
    paths: &builder_paths
      - 'src/structure_pretrain/library_builder/**'
      - 'scripts/build_structure_library.py'
      - 'scripts/inspect_msdial_library.py'
      - 'configs/library_build.yaml'
      - 'examples/library_builder/**'
      - 'tests/library_builder/**'
      - 'requirements-library.txt'
      - '.github/workflows/library_builder.yml'
  pull_request:
    paths: *builder_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install builder-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-library.txt pytest==9.0.3 ruff==0.15.17
          python -m pip install --no-deps -e .
      - name: Check isolated builder and tests
        run: |
          python -c "import sys; import structure_pretrain.library_builder.pipeline; assert 'torch' not in sys.modules"
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q --confcutdir=tests/library_builder tests/library_builder
      - name: Demo build, no model training
        run: |
          python scripts/build_structure_library.py --config examples/library_builder/demo_build.yaml --chains examples/library_builder/chains.tsv --polar examples/library_builder/polar_moieties.tsv --p-to-o-mapping examples/library_builder/p_to_o_mapping.tsv --output data/structure_library_v0.1_demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-structure-library
          path: |
            data/structure_library_v0.1_demo/*.parquet
            data/structure_library_v0.1_demo/library_report.json
            data/structure_library_v0.1_demo/build_config_resolved.yaml
